name: Publish to VS Code Marketplace

# Publish on every push to main. The version-gate that previously only
# published when package.json's version changed was the root cause of GitLoupe
# never reaching the Marketplace: a CI failure (or a subsequent non-versioning
# fix commit) left the publish step skipped, and no run ever actually called
# `vsce publish`. We now always attempt the publish so a real failure (taken
# name, expired PAT, etc.) is surfaced instead of silently skipped. Re-running
# `vsce publish` for an already-published version is a harmless no-op error.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Publish ${{ steps.version.outputs.current }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "Publishing tetsuji16.gitloupe-explorer@${version}"
          npx vsce publish --no-dependencies --readme-path README.marketplace.md --pat "$VSCE_PAT"
